databases:
  - name: bidcompliance-db
    databaseName: bidcompliance
    user: bytebusters
    plan: free

services:
  # Backend FastAPI Web Service (Runs container with Python 3.11 + Tesseract OCR)
  - type: web
    name: bid-compliance-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/ready
    envVars:
      - key: PORT
        value: 8000
      - key: DATABASE_URL
        fromDatabase:
          name: bidcompliance-db
          property: connectionString

      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
      - key: UPLOAD_DIR
        value: /app/uploads

  # Frontend React / Vite Static Site
  - type: web
    name: bid-compliance-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://bid-compliance-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://bid-compliance-api.onrender.com
